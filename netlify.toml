# DineEQR by Black Cardinal — Netlify Production Deployment Configuration
# Configures build pipelines, serverless functions, SPA redirects, and security headers.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route API requests to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# React Router SPA direct navigation & refresh fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production HTTP Security Headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    # Enforce HTTPS across all subdomains with 1-year max-age
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Defend against clickjacking by denying iframe embedding
    X-Frame-Options = "DENY"

    # Control information sent in the Referer header
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict unneeded browser hardware and privileged capabilities
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=()"

    # Cross-Origin Protections
    X-Permitted-Cross-Domain-Policies = "none"

    # Content Security Policy (CSP) tailored for DineEQR
    # - Scripts: Local bundled scripts only
    # - Styles: Local CSS + Google Fonts + inline style tokens for dynamic restaurant themes
    # - Fonts: Local fonts + Google Fonts + data:
    # - Images: Local assets + data URIs (QR SVG/Canvas) + blob URIs + HTTPS restaurant images
    # - Connect: Local APIs + Google Fonts
    # - Frame Ancestors: Disallowed (Clickjacking defense)
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; form-action 'self' https://wa.me https://api.whatsapp.com; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;"

# API-specific security headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
